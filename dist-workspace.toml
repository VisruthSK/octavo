[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Files to include in each archive besides the licenses and README
include = ["THIRD-PARTY-LICENSES.txt"]
allow-dirty = ["ci"]
github-attestations = true
publish-prereleases = true
# The gates run after the builds and before the GitHub Release is created. A failed gate stops the release.
publish-jobs = ["./ci", "./corpus"]
github-build-setup = "../build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
