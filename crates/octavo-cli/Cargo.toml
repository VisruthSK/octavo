[package]
name = "octavo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line optimizer for the self-contained HTML that Quarto writes with embed-resources: true."
readme = "../../README.md"
keywords = ["quarto", "html", "optimizer", "minifier"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "src/**",
    "tests/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "octavo"
path = "src/main.rs"
doc = false

[dependencies]
percent-encoding = "2.3.2"
octavo = { version = "0.1.0-alpha.1", path = "../octavo" }
clap = { version = "4", features = ["derive"] }
anstream = "1.0.0"
anstyle = "1.0.14"
bytesize = "2.7.0"
indicatif = { version = "0.18.6", default-features = false }
rayon = "1.12.0"
dirs = "7.0.0"
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
