[package]
name = "octavo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shrinks the self-contained HTML that Quarto writes with embed-resources: true."
readme = "../../README.md"
keywords = ["quarto", "html", "optimizer", "minifier"]
categories = ["web-programming", "compression"]
include = [
    "src/**",
    "tests/**",
    "loader/loader.js",
    "loader/brotli.js",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
base64 = "0.23.1"
brotli = "9.1.1"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor"] }
serde_json = "1"
oxc = { version = "0.158", features = ["minifier", "codegen", "mangler"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wuff = "0.2.10"
base91 = { version = "0.1.0", default-features = false, features = ["std", "xml-friendly"] }
data-url = "0.3.2"
percent-encoding = "2.3.2"
cssparser = "0.37"
rayon = "1.12.0"
blake3 = { version = "1", default-features = false }
woofwoof = "1.0.2"
libdeflater = "1.26.1"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
imgref = "1.12.3"
rgb = "0.8.53"
gamut-webp = "0.3.1"
gamut-core = "2.0.1"
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
indexmap = "2.14.2"
html-escape = "0.3.1"
skrifa = { package = "fontcull-skrifa", version = "0.39.2" }
skera = "0.10.0"
read-fonts = { version = "0.47.0", default-features = false, features = ["std"] }
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
flate2 = "1"
proptest = "1.12"
regex = "1.13"
