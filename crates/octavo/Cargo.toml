[package]
name = "octavo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shrinks the self-contained HTML that Quarto writes with embed-resources: true."
readme = "../../README.md"
keywords = ["quarto", "html", "optimizer", "minify"]
categories = ["web-programming", "compression"]

[dependencies]
base64 = "0.23"
brotli = "7"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor"] }
serde_json = "1"
fontcull = "2"
oxc = { version = "0.158", features = ["minifier", "codegen", "mangler"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wuff = "0.2.10"
base91 = { version = "0.1.0", default-features = false, features = ["std", "xml-friendly"] }
data-url = "0.3.2"
percent-encoding = "2.3.2"
cssparser = "0.37"
rayon = "1.12.0"
libdeflater = "1.26.1"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
imgref = "1.12.3"
rgb = "0.8.53"
gamut-webp = "0.3.1"
gamut-core = "2.0.1"
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
indexmap = "2.14.2"
html-escape = "0.3.1"
skrifa = { package = "fontcull-skrifa", version = "0.39.2" }

[dev-dependencies]
flate2 = "1"
