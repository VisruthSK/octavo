[workspace]
resolver = "2"
members = ["crates/octavo", "crates/octavo-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0-alpha.1"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Visruth Srimath Kandali"]
repository = "https://github.com/VisruthSK/octavo"

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
