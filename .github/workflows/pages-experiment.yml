name: OCTAVO_PAGES Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build octavo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p octavo-cli --bin octavo
      - uses: actions/upload-artifact@v8
        with:
          name: octavo-binary
          path: target/release/octavo
          retention-days: 1

  experiment:
    name: ${{ matrix.browser }} (PAGES=${{ matrix.pages }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        pages: [2, 3, 4, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: octavo-binary
          path: target/release
      - run: chmod +x target/release/octavo
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps ${{ matrix.browser }} && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: corpus-full-1-10-${{ hashFiles('corpus/sources.json', 'corpus/selection.json', 'corpus/fonts.json') }}
      - run: node corpus/upstream.mjs --jobs 2 --tier full --shard 1/10
      - name: Run verification
        env:
          OCTAVO_BROWSER: ${{ matrix.browser }}
          OCTAVO_PAGES: ${{ matrix.pages }}
        run: |
          mkdir -p out
          node verify/corpus.mjs --tier full --browser --shard 1/10 --out "out/run" 2>&1 | tee out/run.log
      - name: Extract timing and timeouts
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("out/run.log")) process.exit(0);
            const log = fs.readFileSync("out/run.log", "utf8");
            const timeouts = (log.match(/capture timed out/g) || []).length;
            const comparisons = [...log.matchAll(/\[(\d+)\/(\d+)\]\s+(\S+)\s+(\S+)\s+([\d.]+)s/g)];
            const totalSeconds = comparisons.reduce((sum, m) => sum + parseFloat(m[5]), 0);
            const count = comparisons.length;
            const secPerComparison = count > 0 ? (totalSeconds / count).toFixed(2) : 0;
            const summary = {
              browser: "${{ matrix.browser }}",
              pages: ${{ matrix.pages }},
              count,
              totalSeconds,
              secPerComparison,
              timeouts,
            };
            fs.writeFileSync("out/summary.json", JSON.stringify(summary, null, 2));
            console.log("Summary:", summary);
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timing-${{ matrix.browser }}-pages-${{ matrix.pages }}
          path: out/summary.json
          if-no-files-found: ignore
