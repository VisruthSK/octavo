name: Corpus

on:
  push:
    branches: [main]
    paths: &paths
      - "crates/**"
      - "corpus/**"
      - "verify/**"
      - "Cargo.lock"
      - ".github/workflows/corpus.yml"
  pull_request:
    paths: *paths
  workflow_call:
  workflow_dispatch:
    inputs:
      tier:
        description: smoke is a quick stratified sample, full is every document, select rebuilds corpus/selection.json from every upstream document
        type: choice
        options: [smoke, full, select]
        default: smoke
      filter:
        description: Only verify documents whose id matches this regular expression
        default: "."
      diagnose:
        description: Upload screenshots and a zoom of the differing region for this document id
        default: ""
      diagnose_scenario:
        description: Which scenario to capture for the diagnosis
        default: tablet
      diagnose_level:
        description: Which level of the document to capture
        default: packed
      baseline:
        description: Write a size baseline from this full run and upload it as an artifact, to commit as corpus/baseline.json
        type: boolean
        default: false

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tier || 'auto' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED: ${{ inputs.tier }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            tier="$REQUESTED"
          elif [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; }; then
            tier=smoke
          else
            tier=full
          fi
          if [ "$BASELINE" = true ] && [ "$tier" != full ]; then
            echo "the baseline is written from the full tier; dispatch with tier full" >&2
            exit 1
          fi
          if [ "$tier" = full ]; then shards="$(node -e 'console.log(JSON.stringify(Array.from({length: 24}, (_, i) => i + 1)))')"; else shards='[1,2,3,4]'; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  select:
    name: Select upstream documents
    needs: plan
    if: needs.plan.outputs.tier == 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps chromium && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - run: node corpus/upstream.mjs --select --jobs 3
      - uses: actions/upload-artifact@v7
        with:
          name: selection
          path: |
            corpus/selection.json
            corpus/excluded.json

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.plan.outputs.tier == 'smoke' && 'off' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.plan.outputs.tier == 'smoke' && '16' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.plan.outputs.tier }}
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: octavo-binary
          path: target/release/octavo
          retention-days: 3

  corpus:
    name: Corpus (${{ needs.plan.outputs.tier }}, shard ${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.tier == 'smoke' && 30 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TIER: ${{ needs.plan.outputs.tier }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: octavo-binary
          path: target/release
      - run: chmod +x target/release/octavo
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps chromium && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - run: node corpus/build.mjs --check
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: corpus-${{ needs.plan.outputs.tier }}-${{ matrix.shard }}-${{ strategy.job-total }}-${{ hashFiles('corpus/sources.json', 'corpus/selection.json', 'corpus/fonts.json') }}
      - run: node corpus/upstream.mjs --jobs 2 --tier "$TIER" --shard "$SHARD"
      - run: node verify/corpus.mjs --tier "$TIER" --browser --shard "$SHARD" --filter "${{ inputs.filter || '.' }}" ${{ inputs.baseline && '--update-baseline' || '' }}
      - name: Diagnose one document
        if: always() && inputs.diagnose != ''
        run: |
          original="corpus/.cache/rendered/${{ inputs.diagnose }}.html"
          [ -f "$original" ] || original="corpus/.cache/docs/${{ inputs.diagnose }}.html"
          optimized="out/corpus/${{ inputs.diagnose }}.${{ inputs.diagnose_level }}.html"
          if [ -f "$original" ] && [ -f "$optimized" ]; then
            node verify/screenshots.mjs "$PWD/$original" "$PWD/$optimized" "${{ inputs.diagnose_scenario }}" out/diagnose/whole
            target/release/octavo "$original" out/subset.html --level "${{ inputs.diagnose_level }}" --subset-fonts --no-cache
            node verify/screenshots.mjs "$PWD/$original" "$PWD/out/subset.html" "${{ inputs.diagnose_scenario }}" out/diagnose/subset
          fi
      - uses: actions/upload-artifact@v7
        if: always() && inputs.diagnose != ''
        with:
          name: diagnose-${{ matrix.shard }}
          path: out/diagnose
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-report-${{ matrix.shard }}
          path: out/corpus
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always() && inputs.baseline
        with:
          name: baseline-${{ matrix.shard }}
          path: corpus/baseline.json
          if-no-files-found: ignore

  baseline:
    name: Baseline
    needs: [plan, corpus]
    if: inputs.baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: baseline-*
          path: out/baseline
      - run: node corpus/baseline.mjs --merge out/baseline
      - uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: corpus/baseline.json
          retention-days: 7

  linked:
    name: Linked renders (${{ needs.plan.outputs.tier }}, shard ${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.tier == 'smoke' && 30 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TIER: ${{ needs.plan.outputs.tier }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: octavo-binary
          path: target/release
      - run: chmod +x target/release/octavo
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps chromium && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: corpus-${{ needs.plan.outputs.tier }}-${{ matrix.shard }}-${{ strategy.job-total }}-${{ hashFiles('corpus/sources.json', 'corpus/selection.json', 'corpus/fonts.json') }}
      - run: node corpus/upstream.mjs --jobs 2 --tier "$TIER" --shard "$SHARD"
      - run: node verify/linked.mjs --tier "$TIER" --browser --shard "$SHARD" --filter "${{ inputs.filter || '.' }}"
      - if: always()
        run: '[ -f out/linked/report.md ] && cat out/linked/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linked-report-${{ matrix.shard }}
          path: out/linked/report.md
          if-no-files-found: ignore

  projects:
    name: Projects (${{ needs.plan.outputs.tier }}, shard ${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.tier == 'smoke' && 60 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TIER: ${{ needs.plan.outputs.tier }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      OCTAVO_PAGES: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: octavo-binary
          path: target/release
      - run: chmod +x target/release/octavo
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps chromium && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - run: node corpus/build.mjs --check
      - run: node --test "corpus/**/*.test.mjs"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: projects-${{ hashFiles('corpus/sources.json', 'corpus/projects.json', 'corpus/fonts.json') }}
      - run: node corpus/fonts.mjs
      - run: node verify/projects.mjs --tier "$TIER" --browser --shard "$SHARD" --filter "${{ inputs.filter || '.' }}"
      - if: always()
        run: '[ -f out/projects/report.md ] && cat out/projects/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: projects-report-${{ matrix.shard }}
          path: out/projects/report.md
          if-no-files-found: ignore

  totals:
    name: Totals
    needs: [plan, corpus]
    if: always() && needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: corpus-report-*
          path: reports
      - run: node verify/merge-reports.mjs reports
