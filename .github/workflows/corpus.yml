name: Corpus

on:
  push:
    branches: [main]
    paths: &paths
      - "crates/**"
      - "corpus/**"
      - "verify/**"
      - "Cargo.lock"
      - ".github/workflows/corpus.yml"
  pull_request:
    paths: *paths
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:
  workflow_dispatch:
    inputs:
      tier:
        description: smoke is a quick stratified sample, full is every document, select rebuilds corpus/selection.json from every upstream document
        type: choice
        options: [smoke, full, select]
        default: smoke

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tier || 'auto' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED: ${{ inputs.tier }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            tier="$REQUESTED"
          elif [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; }; then
            tier=smoke
          else
            tier=full
          fi
          if [ "$tier" = full ]; then shards='[1,2,3,4,5,6]'; else shards='[1,2]'; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  select:
    name: Select upstream documents
    needs: plan
    if: needs.plan.outputs.tier == 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - run: node corpus/upstream.mjs --select --jobs 3
      - uses: actions/upload-artifact@v7
        with:
          name: selection
          path: corpus/selection.json

  corpus:
    name: Corpus (${{ needs.plan.outputs.tier }}, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.tier != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.tier == 'smoke' && 30 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TIER: ${{ needs.plan.outputs.tier }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.plan.outputs.tier == 'smoke' && 'off' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.plan.outputs.tier == 'smoke' && '16' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --locked --release
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps chromium && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - run: node corpus/build.mjs --check
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: corpus-${{ needs.plan.outputs.tier }}-${{ matrix.shard }}-${{ strategy.job-total }}-${{ hashFiles('corpus/sources.json', 'corpus/selection.json') }}
      - run: node corpus/upstream.mjs --jobs 2 --tier "$TIER" --shard "$SHARD"
      - run: node verify/corpus.mjs --tier "$TIER" --browser --shard "$SHARD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-report-${{ matrix.shard }}
          path: out/corpus
          if-no-files-found: ignore
