name: Diagnose Font

on:
  push:
    branches: [font-render]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fontTools brotli
      - name: Download prebuilt octavo binary
        continue-on-error: true
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release
          gh run download 43671677423 -n octavo-binary -D target/release --repo VisruthSK/octavo || true
          chmod +x target/release/octavo || true
      - name: Build octavo if missing
        if: steps.dl.outcome != 'success' || hashFiles('target/release/octavo') == ''
        uses: dtolnay/rust-toolchain@stable
      - if: steps.dl.outcome != 'success' || hashFiles('target/release/octavo') == ''
        uses: Swatinem/rust-cache@v2
      - if: steps.dl.outcome != 'success' || hashFiles('target/release/octavo') == ''
        run: cargo build --release --bin octavo
      - run: npm ci
        working-directory: verify
      - run: |
          for attempt in 1 2 3 4; do
            npx playwright-core install --with-deps firefox && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        working-directory: verify
      - run: node corpus/build.mjs
      - run: node verify/diagnose-font.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: font-diagnosis
          path: out/diag
